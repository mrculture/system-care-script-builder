name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Website and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/qa/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install Chromium on the prepared Ubuntu runner
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: node --test ../release/tests/*.test.cjs
      - run: npm test
      - name: Save browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: |
            .github/qa/playwright-report/
            .github/qa/test-results/
          retention-days: 7

  release:
    name: Deploy verified commit with recovery
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            .github/qa/package-lock.json
            .github/release/package-lock.json
      - run: npm ci --ignore-scripts --prefix .github/qa
      - run: npm ci --ignore-scripts --prefix .github/release
      - name: Install Chromium on the prepared Ubuntu runner
        timeout-minutes: 5
        run: npx --prefix .github/qa playwright install chromium
      - name: Deploy, verify and recover if necessary
        run: node .github/release/run.cjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f5c84f030ee282992b5da87ff0a2bcc5
          GIT_DEPLOYMENTS_DISABLED: ${{ vars.GIT_DEPLOYMENTS_DISABLED }}
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-report
          path: |
            .github/release/report/*.json
            .github/release/report/failure.txt
          retention-days: 14
